resources:
  jobs:
    equipment_companies_pipeline:
      name: equipment_companies_pipeline
      description: >-
        Medallion pipeline for the US equipment companies dashboard:
        landing volume -> bronze -> silver -> gold.
      max_concurrent_runs: 1

      tasks:
        - task_key: bronze_ingest
          description: Load the landing CSV into equipmentcompanies.bronze.equipment_companies
          spark_python_task:
            python_file: ../src/bronze/landing_to_bronze.py
          environment_key: default

        - task_key: silver_scrape
          description: Scrape each company website into the equipmentcompanies.silver tables
          depends_on:
            - task_key: bronze_ingest
          spark_python_task:
            python_file: ../src/silver/scrape_sites.py
          environment_key: scraping
          timeout_seconds: 3600

        - task_key: silver_contacts
          description: Pick each company's address, phone and founded year from the scraped pages and add map coordinates
          depends_on:
            - task_key: silver_scrape
          spark_python_task:
            python_file: ../src/silver/company_contacts.py
          environment_key: scraping
          timeout_seconds: 900

        - task_key: gold_build
          description: Clean the silver data and build the dashboard tables in equipmentcompanies.gold
          depends_on:
            - task_key: silver_contacts
          spark_python_task:
            python_file: ../src/gold/build_gold.py
          environment_key: default
          timeout_seconds: 1800

      environments:
        - environment_key: default
          spec:
            environment_version: "2"
        - environment_key: scraping
          spec:
            environment_version: "2"
            dependencies:
              - beautifulsoup4==4.12.3
              - requests>=2.31
